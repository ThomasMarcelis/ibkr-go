name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic-version tag: $TAG"
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "release tags must be annotated"
            exit 1
          fi
          major="${TAG#v}"
          major="${major%%.*}"
          module="$(go list -m)"
          if [ "$major" -ge 2 ] && [ "${module##*/}" != "v$major" ]; then
            echo "release tag $TAG requires a /v$major module path; found $module"
            exit 1
          fi
          if [ "$major" -lt 2 ] && [[ "$module" =~ /v[0-9]+$ ]]; then
            echo "release tag $TAG cannot publish versioned module path $module"
            exit 1
          fi
          git fetch origin main
          commit=$(git rev-list -n 1 "$TAG")
          git merge-base --is-ancestor "$commit" origin/main
          if [[ "$TAG" != *-* ]]; then
            echo 'IBKR_STABLE_RELEASE=1' >> "$GITHUB_ENV"
            echo "IBKR_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          fi

      - name: Verify release commit
        run: |
          go mod tidy -diff
          go mod verify
          test -z "$(gofmt -l .)"
          ./scripts/check-api.sh
          go vet ./...
          go test -race -shuffle=on -count=1 ./...
          ./scripts/fuzz-all.sh 30s
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Extract required changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v tag="$TAG" '
            found && /^## / { exit }
            !found && index($0, "## " tag) == 1 {
              rest = substr($0, length("## " tag) + 1)
              if (rest == "" || substr(rest, 1, 1) == " ") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' notes.md
          sed -i "s#](docs/migration-v2.md)#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/migration-v2.md)#g" notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no release notes for $TAG"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "$TAG" --notes-file notes.md)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
