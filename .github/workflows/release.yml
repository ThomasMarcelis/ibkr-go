name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: extract changelog section
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Match the heading by literal prefix (index/substr, not a dynamic
          # regex) so version dots in the tag can't be misread as wildcards.
          awk -v tag="$TAG" '
            found && /^## / { exit }
            !found && index($0, "## " tag) == 1 {
              rest = substr($0, length("## " tag) + 1)
              if (rest == "" || substr(rest, 1, 1) == " ") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md

          # Trim leading/trailing blank lines left over from the extraction.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' notes.md

          if [ -s notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: create release (changelog notes)
        if: steps.notes.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md

      - name: create release (autogenerated notes)
        if: steps.notes.outputs.has_notes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
