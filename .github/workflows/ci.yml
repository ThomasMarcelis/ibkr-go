name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Files are not gofmt-clean:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: go test (race, coverage)
        run: |
          set -euo pipefail
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: benchmarks compile and smoke
        run: go test -run='^$' -bench=. -benchtime=1x ./...

  fuzz-smoke:
    # Short fuzz pass over every existing fuzz target; push-to-main only to
    # keep PR latency flat.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: fuzz each target briefly
        run: |
          set -euo pipefail
          total=0
          for pkg in ./internal/wire ./internal/codec; do
            targets=$(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz')
            for target in $targets; do
              echo "fuzzing $pkg/$target"
              go test "$pkg" -run='^$' -fuzz="^${target}$" -fuzztime=20s
              total=$((total + 1))
            done
          done
          # A refactor that renames or drops targets must not pass silently.
          if [ "$total" -lt 10 ]; then
            echo "only $total fuzz targets found, expected at least 10"
            exit 1
          fi
